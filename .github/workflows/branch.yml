  # Prepare code and run tests
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v2
      - uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.CSS_ASSETS_SSH_PRIVATE_KEY }}
      - name: Install private assets
        shell: bash
        run: .github/install_private_assets.sh
      - run: echo "API_URL=" > .env
      - run: echo "AMPLITUDE_KEY=" >> .env
      - name: Set up Node environment
        uses: actions/setup-node@v2
      - name: Restore packages from cache - yarn
        uses: actions/cache@v2
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Restore packages from cache - node
        uses: actions/cache@v2
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore packages from cache - pods
        uses: actions/cache@v2
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install node modules
        run: yarn install --immutable
      - name: Run tests with JUnit as reporter
        run: yarn test:coverage
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports/junit/
          JEST_JUNIT_OUTPUT_NAME: test-results.xml
      - uses: actions/upload-artifact@v3
        with:
          name: JUnit
          path: ./reports/junit

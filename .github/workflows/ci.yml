name: Continuous Integration

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!develop'
      - '!develop-legacy'
      - '!release-0.x-legacy'
      - '!stage'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v2
      - name: Install private assets
        run: |-
          bash .github/install_private_assets.sh
      - name: Set up Node environment
        uses: actions/setup-node@master
      - name: Check cache
        uses: c-hive/gha-yarn-cache@v1
      - name: Install node modules
        run: |-
          yarn install --immutable
      - name: Lint
        run: |-
          yarn lint:ci
      - name: Prettier
        run: |-
          yarn prettier

  # Prepare code and check i18n
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v2
      - name: Install private assets
        run: |-
          bash .circleci/install_private_assets.sh
      - name: Set up Node environment
        uses: actions/setup-node@master
      - name: Check cache
        uses: c-hive/gha-yarn-cache@v1
      - name: Install node modules
        run: |-
          yarn install --immutable
      - name: Check Swedish translations
      - run: |-
          yarn test:i18n 'sv-SE'

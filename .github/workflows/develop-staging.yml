  # Publish app for internal testing
  # - App Center distribution (with approval)
  # |-- iOS / Android Release to App Center
  # |-- Message slack message on App Center upload successful
  deploy-stage-release:
    name: Staging app build and release
    runs-on: macos-latest
    environment: staging-release
    timeout-minutes: 30
    steps:
      # -----> Adhoc build <-----
      - name: Check out Git repository
        uses: actions/checkout@v3
      - uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.CSS_ASSETS_SSH_PRIVATE_KEY }}
      - name: Install private assets
        shell: bash
        run: .github/install_private_assets.sh
      # Ruby setup
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6
          # bundler-cache: true
      - name: Restore packages from cache - bundler
        uses: actions/cache@v2
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-
      - name: Install bundler
        run: gem install bundler
      - name: Install gems
        run: |
          bundle config path vendor/bundle
          bundle check || bundle install --path vendor/bundle --clean
        env:
          BUNDLE_JOBS: '4'
          BUNDLE_RETRY: '3'
      # Node install
      - name: Set up Node environment
        uses: actions/setup-node@v2
      - name: Restore packages from cache - yarn
        uses: actions/cache@v2
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Restore packages from cache - node
        uses: actions/cache@v2
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore packages from cache - pods
        uses: actions/cache@v2
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install node modules
        run: yarn install --immutable
      - name: Bundle RN Android assets
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Clean up after bundling
        run: rm -rf ./android/app/src/main/res/drawable-* && rm -rf ./android/app/src/main/res/raw

      # -----> Adhoc iOS <-----
      - name: Prepare deploy environment
        run: |
          bundle update fastlane
          bundle exec fastlane update_plugins
      - name: Make deploy environment
        shell: bash
        run: .github/make_deploy_env.sh
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          RELEASE_TYPE: ${{ secrets.RELEASE_TYPE }}
          NAME: ${{ secrets.NAME }}
          API_URL: ${{ secrets.API_URL }}
          AMPLITUDE_KEY: ${{ secrets.AMPLITUDE_KEY }}
          SENTRY_DSN_URL: ${{ secrets.SENTRY_DSN_URL }}
          SENTRY_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_PROPERTIES: ${{ secrets.SENTRY_PROPERTIES }}
          APPCENTER_API_TOKEN: ${{ secrets.APPCENTER_API_TOKEN }}
          APPCENTER_ANDROID_TOKEN: ${{ secrets.APPCENTER_ANDROID_TOKEN }}
          APPCENTER_IOS_PROJECT_NAME: ${{ secrets.APPCENTER_IOS_PROJECT_NAME }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          iOS_SCHEME: ${{ secrets.iOS_SCHEME }}
          iOS_APP_ID: ${{ secrets.iOS_APP_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - run: yarn generate:git-hash
      - name: Debug - Echo release type
        run: echo 'RELEASE_TYPE:' $RELEASE_TYPE
        env:
          RELEASE_TYPE: ${{ secrets.RELEASE_TYPE }}
      - name: Bundle clean and install
        run: bundle install --path vendor/bundle --clean
      - name: Install xcode - required to set xcode to v13
        run: gem install xcode-install
      - name: Pod clean and install
        # rm -rf ~/Library/Developer/Xcode/DerivedData/*
        # cd ios && rm -rf Pods
        run: |
          cd ios && pod install --clean-install
      - name: Generate fastlane certificates
        run: yarn fastlane:ios:certificates
      - name: Fastlane ios release WITH NODE v14.17.0
        run: |
          set +e
          export NVM_DIR="/opt/github/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install v14.17.0            
          npm install -g yarn 
          yarn fastlane:ios:release env:$RELEASE_TYPE
      - name: Upload build
        uses: actions/upload-artifact@v3
        with:
          name: staging-ios-build
          path: ~/covid-react/build

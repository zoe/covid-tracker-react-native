name: Staging deployment via develop branch

on:
  push:
    branches:
      - 'develop'
      - 'julia/gh-actions-staging-test'

jobs:
  deploy-stage-ota:
    name: Deploy staging OTA
    runs-on: macos-latest
    environment: staging-ota
    timeout-minutes: 15
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v2
      - uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.CSS_ASSETS_SSH_PRIVATE_KEY }}
      - name: Install private assets
        shell: bash
        run: .github/install_private_assets.sh
      # Bundler install
      - name: Restore packages from cache - bundler
        uses: actions/cache@v2
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundler-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundler-
      - name: Install bundler
        run: gem install bundler
      - name: Install gems
        run: bundle check || bundle install --path vendor/bundle --clean
        env:
          BUNDLE_JOBS: '4'
          BUNDLE_RETRY: '3'
      # Node install
      - name: Set up Node environment
        uses: actions/setup-node@v2
      - name: Restore packages from cache - yarn
        uses: actions/cache@v2
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Restore packages from cache - node
        uses: actions/cache@v2
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore packages from cache - pods
        uses: actions/cache@v2
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install node modules
        run: yarn install --immutable
      - name: Bundle RN Android assets
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Clean up after bundling
        run: rm -rf ./android/app/src/main/res/drawable-* && rm -rf ./android/app/src/main/res/raw
      - name: Prepare deploy environment
        run: |
          bundle update fastlane
          bundle exec fastlane update_plugins
          bash .github/make_deploy_env.sh
          yarn generate:git-hash
      # Not working atm - echo "export RELEASE_CHANNEL=$(grep EXPO_RELEASE_CHANNEL .env | cut -d '=' -f2)" >> $BASH_ENV
      - name: Expo OTA publish
        run: |
          npx expo-cli login -u ${{ secrets.EXPO_USERNAME }} -p ${{ secrets.EXPO_PASSWORD }}
          npx expo-cli publish --non-interactive --max-workers 1 --release-channel ${RELEASE_CHANNEL} --target bare

  # Publish app for internal testing
  # - App Center distribution (with approval)
  # |-- iOS / Android Release to App Center
  # |-- Message slack message on App Center upload successful
  deploy-stage-release:
    name: Staging app build and release
    runs-on: macos-latest
    environment: staging-release
    timeout-minutes: 30
    steps:
      # -----> Adhoc build <-----
      - name: Check out Git repository
        uses: actions/checkout@v2
      - uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.CSS_ASSETS_SSH_PRIVATE_KEY }}
      - name: Install private assets
        shell: bash
        run: .github/install_private_assets.sh
      # Bundler install
      - name: Restore packages from cache - bundler
        uses: actions/cache@v2
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundler-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundler-
      - name: Install bundler
        run: gem install bundler
      - name: Install gems
        run: bundle check || bundle install --path vendor/bundle --clean
        env:
          BUNDLE_JOBS: '4'
          BUNDLE_RETRY: '3'
      # Node install
      - name: Set up Node environment
        uses: actions/setup-node@v2
      - name: Restore packages from cache - yarn
        uses: actions/cache@v2
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Restore packages from cache - node
        uses: actions/cache@v2
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Restore packages from cache - pods
        uses: actions/cache@v2
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Install node modules
        run: yarn install --immutable
      - name: Bundle RN Android assets
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Clean up after bundling
        run: rm -rf ./android/app/src/main/res/drawable-* && rm -rf ./android/app/src/main/res/raw

      # -----> Adhoc iOS <-----
      - name: Prepare deploy environment
        run: |
          bundle update fastlane
          bundle exec fastlane update_plugins
          bash .circleci/make_deploy_env.sh
          yarn generate:git-hash
      - name: Debug - Echo release type
        run: echo 'RELEASE_TYPE:' $RELEASE_TYPE
      - name: Bundle clean and install
        run: bundle install --path vendor/bundle --clean
      - name: Install xcode - required to set xcode to v13
        run: gem install xcode-install
      - name: Pod clean and install
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          mkdir ios
          cd ios && rm -rf Pods
          cd ios && pod install --clean-install
      - name: Generate fastlane certificates
        run: yarn fastlane:ios:certificates
      - name: Fastlane ios release WITH NODE v14.17.0
        run: |
          set +e
          export NVM_DIR="/opt/circleci/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install v14.17.0            
          npm install -g yarn 
          yarn fastlane:ios:release env:$RELEASE_TYPE
      - name: Upload build
        uses: actions/upload-artifact@v3
        with:
          name: staging-ios-build
          path: ~/covid-react/build
